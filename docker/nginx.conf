# 察元 AI Docker — nginx 反代 + 前端 SPA
#
# 浏览器开 http://<host>/  → 前端 React SPA
# fetch 走相对路径,nginx 反代到 chayuan-server (127.0.0.1:62581)
# 同源,无 CORS。

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 关 access log,容器里没用
    access_log off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # SSE / 大文件上传:chat 流式响应一直挂,不要 buffer 不要 timeout
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 1024m;

    # gzip 前端 bundle
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1024;

    upstream chayuan_api {
        server 127.0.0.1:62581;
        keepalive 32;
    }

    upstream chayuan_config_panel {
        server 127.0.0.1:8502;
        keepalive 8;
    }

    server {
        listen      80 default_server;
        server_name _;

        root  /chayuan/web;
        index index.html;

        # 1. 健康检查:nginx 起就 ready (后端 ready 由 Dockerfile HEALTHCHECK
        #    包到 /healthz,这里返 200 让 nginx 自身可探)
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # 2. 后端 API 路径全部反代到 chayuan-server:62581
        #    凡是 chayuan-server 暴露的 path 都列上,前端 fetch 用相对路径
        #    /v1/* 是 OpenAI 兼容接口(models / chat/completions / embeddings),
        #    第三方 (WPS / Cursor / 任何 OpenAI SDK) 直接 baseURL=http://host:8080/v1
        location ~ ^/(api|v1|chat|knowledge_base|knowledge_universe|knowledge_source|admin|runtime|model_registry|tools|tool|prompts|temp|file|files|media|img|status|live|ready|metrics|conversation|user|users|auth|kb-query|sse|sidecar|install_jobs|annotation|llm|llm_model|ai_platform|local_runtime|provider|capability|home)(/|$) {
            proxy_pass http://chayuan_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 长连接 + 禁 buffer
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # 3. config panel (NiceGUI) 反代到 :8502
        location /config-panel/ {
            rewrite ^/config-panel/(.*) /$1 break;
            proxy_pass http://chayuan_config_panel;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_read_timeout 86400;
        }

        # 4. 前端 SPA: 文件存在直发,否则 fallback index.html (React Router)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
