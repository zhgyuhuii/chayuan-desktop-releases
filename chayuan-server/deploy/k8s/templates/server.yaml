{{- if .Values.server.enabled }}
{{- if .Values.server.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "chayuan.server.fullname" . }}-data
  labels: {{- include "chayuan.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.server.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.server.persistence.size }}
  {{- if or .Values.server.persistence.storageClass .Values.global.storageClass }}
  storageClassName: {{ default .Values.global.storageClass .Values.server.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chayuan.server.fullname" . }}
  labels: {{- include "chayuan.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels: {{- include "chayuan.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "chayuan.server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.global.registry }}/{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
          env:
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: DATABASE_URL
              value: {{ .Values.postgres.url | quote }}
            - name: MILVUS_URL
              value: {{ .Values.milvus.url | quote }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.minio.endpoint | quote }}
            - name: MINIO_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            - name: ONLYOFFICE_URL
              value: {{ .Values.onlyoffice.url | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
          {{- if .Values.server.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/chayuan
          {{- end }}
      {{- if .Values.server.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "chayuan.server.fullname" . }}-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chayuan.server.fullname" . }}
  labels: {{- include "chayuan.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "chayuan.server.selectorLabels" . | nindent 4 }}
{{- if .Values.server.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chayuan.server.fullname" . }}
spec:
  ingressClassName: {{ .Values.server.ingress.className }}
  rules:
    {{- range .Values.server.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "chayuan.server.fullname" $ }}
                port:
                  number: {{ $.Values.server.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
