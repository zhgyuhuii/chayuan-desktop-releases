[project]
name = "chayuan-gateway"
version = "0.1.0"
description = "OpenAI-compatible gateway with auto model registry, SSE, OCR/T2I/T2V"
requires-python = ">=3.10"
dependencies = [
    "chayuan-core",
    "chayuan-registry",
    "chayuan-runtime",
    "chayuan-supervisor",
    # 必须与 chayuan-server 主仓和 nicegui 1.4.x 保持一致 —— 之前写 >=0.110
    # 会让 pip 拉到 0.13x,触发"chayuan-server requires fastapi<0.110.0 但
    # 你装了 0.136.1"的解析冲突。锁到 0.109.x 与 sse-starlette 1.8.x 同步。
    "fastapi>=0.109.2,<0.110.0",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "sse-starlette>=1.8.2,<1.9.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
chayuan-gateway = "chayuan_gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chayuan_gateway"]
