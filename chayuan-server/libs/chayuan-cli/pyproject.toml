[project]
name = "chayuan-cli"
version = "0.1.0"
description = "Chayuan unified CLI: model / service / doctor / info"
requires-python = ">=3.10"
dependencies = [
    "chayuan-core",
    "chayuan-registry",
    "chayuan-modelmgr",
    "chayuan-discovery",
    "chayuan-supervisor",
    "chayuan-gateway",
    "chayuan-preflight",
    "click>=8.1",
    "rich>=13.7",
]

# NOTE: 在合并后的察元仓库中，主 `chayuan` 二进制由 chayuan-server 的
# `chayuan/cli.py` 提供（已包含 init/start/stop/worker 等命令）。本包以
# `chayuan-ai` 名字暴露，仅做"AI 平台子集"独立 CLI 备选；同时它作为 Click 群组
# 被 chayuan-server 通过 chayuan.server.ai_platform.cli_bridge 注入到主 CLI 的
# `chayuan ai-platform ...` 子命令下。
[project.scripts]
chayuan-ai = "chayuan_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chayuan_cli"]
