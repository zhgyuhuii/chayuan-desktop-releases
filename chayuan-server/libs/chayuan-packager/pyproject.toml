[project]
name = "chayuan-packager"
version = "0.1.0"
description = "Cross-platform installer build pipeline (Win/Mac/Linux x Lite/Standard/Pro)"
requires-python = ">=3.10"
dependencies = ["chayuan-core", "click>=8.1", "rich>=13.7", "pyyaml>=6.0", "zstandard>=0.22"]

[project.scripts]
chayuan-pack = "chayuan_packager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chayuan_packager"]
