[project]
name = "chayuan-registry"
version = "0.1.0"
description = "Model registry: SQLAlchemy ORM with SQLite default and Postgres optional"
requires-python = ">=3.10"
dependencies = ["chayuan-core", "sqlalchemy>=2.0", "pydantic>=2.5"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chayuan_registry"]
