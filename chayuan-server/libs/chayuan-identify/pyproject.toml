[project]
name = "chayuan-identify"
version = "0.1.0"
description = "Five-level model auto-identification with hot-reloadable rules"
requires-python = ">=3.10"
dependencies = ["chayuan-core", "pyyaml>=6.0", "pydantic>=2.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chayuan_identify"]
