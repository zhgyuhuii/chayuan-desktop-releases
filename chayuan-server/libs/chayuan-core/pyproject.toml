[project]
name = "chayuan-core"
version = "0.1.0"
description = "Cross-platform paths, config, events, platform info"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "psutil>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chayuan_core"]
