# vLLM — 高吞吐 LLM 推理(NVIDIA GPU)
# ---------------------------------------------------------------------------
# 启动:  docker compose -f vllm.yaml up -d --wait
# 停止:  docker compose -f vllm.yaml stop
# 日志:  docker compose -f vllm.yaml logs -f
#
# 镜像源切换:改下面 ``image:`` 字段即可,例如:
#   官方:        vllm/vllm-openai:latest
#   DaoCloud:    docker.m.daocloud.io/vllm/vllm-openai:latest
#   1ms.run:     docker.1ms.run/vllm/vllm-openai:latest
#   阿里云:      registry.cn-hangzhou.aliyuncs.com/chayuan/vllm-openai:latest
# ---------------------------------------------------------------------------

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: chayuan-vllm
    restart: unless-stopped
    ports:
      - "18000:8000"
    volumes:
      - vllm-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s    # 首次加载模型可能 30-60s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HUGGING_FACE_HUB_TOKEN=
      # 若国内拉模型慢,改用 modelscope 镜像:
      # - HF_ENDPOINT=https://hf-mirror.com

volumes:
  vllm-models:
