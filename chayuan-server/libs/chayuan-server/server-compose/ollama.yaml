# Ollama — 本地 LLM 运行时(CPU/GPU 自动切换)
# ---------------------------------------------------------------------------
# 启动:  docker compose -f ollama.yaml up -d --wait
# 拉模型:docker exec chayuan-ollama ollama pull qwen2.5:7b
# ---------------------------------------------------------------------------

services:
  ollama:
    image: ollama/ollama:latest
    container_name: chayuan-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    # GPU 加速(可选 — 取消注释启用 NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all

volumes:
  ollama-data:
