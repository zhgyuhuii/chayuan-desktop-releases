[project]
name = "chayuan-modelmgr"
version = "0.1.0"
description = "Model manager: download from hf-mirror, offline import, integrity verify"
requires-python = ">=3.10"
dependencies = [
    "chayuan-core",
    "chayuan-identify",
    "chayuan-registry",
    "huggingface-hub>=0.24",
    "tqdm>=4.66",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chayuan_modelmgr"]
