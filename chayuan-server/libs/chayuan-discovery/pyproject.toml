[project]
name = "chayuan-discovery"
version = "0.1.0"
description = "Model discovery daemon: cross-platform watchdog + 60s polling"
requires-python = ">=3.10"
dependencies = ["chayuan-core", "chayuan-identify", "chayuan-registry", "watchdog>=4.0"]

[project.scripts]
chayuan-discovery = "chayuan_discovery.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chayuan_discovery"]
