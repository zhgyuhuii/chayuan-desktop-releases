[project]
name = "chayuan-supervisor"
version = "0.1.0"
description = "Cross-platform process supervisor with declarative yaml topology"
requires-python = ">=3.10"
dependencies = ["chayuan-core", "psutil>=5.9", "httpx>=0.27", "pyyaml>=6.0"]

[project.scripts]
chayuan-supervisor = "chayuan_supervisor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chayuan_supervisor"]
