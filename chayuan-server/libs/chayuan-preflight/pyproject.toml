[project]
name = "chayuan-preflight"
version = "0.1.0"
description = "Pre-flight safety checks: AV, Gatekeeper, SELinux, ports, perms"
requires-python = ">=3.10"
dependencies = ["chayuan-core", "psutil>=5.9", "rich>=13.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chayuan_preflight"]
