[project]
name = "chayuan-packaging"
version = "0.1.0"
description = "察元一体化平台跨平台打包器（Python 3.12）— vendor 自动拉取 + AppImage/dmg/exe 生成"
requires-python = ">=3.12"
authors = [{name = "Chayuan Team"}]
license = {text = "Apache-2.0"}
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.24"]

[project.scripts]
chayuan-pack = "chayuan_packaging.pack:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chayuan_packaging"]
